{% extends 'admin/master.html' %}

{% block body %}
{% if current_user.is_authenticated %}
<h1 class="text-info mt-1">WELCOME TO ADMIN SITE!</h1>
<h2 class="text-success">Hello {{ current_user.full_name }}!</h2>
{% else %}

<h2 class="text-success text-center">LOGIN ADMINISTRATOR</h2>

<form method="post" action="/login">
  <div class="form-group">
    <label for="username">Username:</label>
    <input type="text" class="form-control" placeholder="Username" id="username" name="username">
  </div>
  <div class="form-group">
    <label for="pwd">Password:</label>
    <input type="password" class="form-control" placeholder="Password" id="pwd" name="password">
  </div>
  <div class="form-group form-check">
    <label class="form-check-label">
      <input class="form-check-input" type="checkbox"> Remember me
    </label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>

{% endif %}

{% endblock %}
