{% extends 'admin/master.html' %}

{% block body %}

{% if current_user.is_authenticated %}
<h1 class="text-info mt-1">WELCOME TO ADMIN SITE!</h1>
<h2 class="text-success">Hello {{ current_user.full_name }}!</h2>
{% else %}

<h2 class="text-success text-center">ĐĂNG NHẬP QUẢN TRỊ</h2>

<form method="post" action="/login">
  <div class="form-group">
    <label for="username">Tên đăng nhập:</label>
    <input type="text" class="form-control" placeholder="Tên đăng nhập" id="username" name="username">
  </div>
  <div class="form-group">
    <label for="pwd">Mật khẩu:</label>
    <input type="password" class="form-control" placeholder="Mật khẩu" id="pwd" name="password">
  </div>
  <div class="form-group form-check">
    <label class="form-check-label">
      <input class="form-check-input" type="checkbox"> Remember me
    </label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>

{% endif %}

{% endblock %}
