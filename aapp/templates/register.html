{% extends 'layout/base.html' %}

{% block title %}Register{% endblock %}

{% block navbar %}
<li class="nav-item">
    <a class="nav-link" href="/">Home</a>
</li>
{% endblock %}

{% block content %}
<h1 class="text-success mt-2 text-center">Register</h1>

{% if err_msg %}
<div class="alert alert-danger">{{ err_msg }}</div>
{% endif %}

<form method="post" action="/register" enctype="multipart/form-data">

    <div class="form-floating mb-3 mt-3">
        <input type="text" class="form-control" id="name" placeholder="Fullname" name="name" required>
        <label for="name">Fullname</label>
    </div>

    <div class="form-floating mb-3 mt-3">
        <select class="form-select" id="role" name="role" aria-label="Choose role">
            <option value="TENANT" selected>Tenant</option>
            <option value="MANAGER">Manager</option>
            <option value="TECHNICIAN">Technician</option>
        </select>
        <label for="role">Role</label>
    </div>

    <div class="form-floating mb-3 mt-3">
        <input type="text" class="form-control" id="username" placeholder="Username" name="username" required>
        <label for="username">Username</label>
    </div>

    <div class="form-floating mt-3 mb-3">
        <input type="password" class="form-control" id="password" placeholder="Password" name="password" required>
        <label for="password">Password</label>
    </div>

    <div class="form-floating mt-3 mb-3">
        <input type="password" class="form-control" id="confirm" placeholder="Confirm" name="confirm">
        <label for="confirm">Confrim</label>
    </div>
    <div class="form-floating mt-3 mb-3">
        <input type="file" class="form-control" id="avatar" name="avatar">
        <label for="avatar">Avatar</label>
    </div>

    <div class="form-floating mt-3 mb-3">
        <button type="submit" class="btn btn-danger w-100">Register</button>
    </div>
</form>

{% endblock %}
